#---------------------------------------------------------------#
#--------------UPLOAD VALIDATION CONFIGURATIONS-----------------#
#---------------------------------------------------------------#
# Extensions accepted in the submission upload step, by document #
# type (HU001, CA03). Used by RdappUploadValidator.             #
#---------------------------------------------------------------#
# The key is the value of local.tipodocumento in lower case, without accents, with every
# run of other characters replaced by "-" ("Mapa de evidências" becomes "mapa-de-evidencias").
# A type without its own key falls back to "default". Leaving "default" empty disables the check.
# Extensions are written without the dot and are compared in lower case.
#
rdapp.upload.extensions.default = pdf
rdapp.upload.extensions.mapa-de-evidencias = pdf, xlsx, xls, xlsm, xlsb
rdapp.upload.extensions.scoping-review = pdf, epub
rdapp.upload.extensions.livro = pdf, epub
